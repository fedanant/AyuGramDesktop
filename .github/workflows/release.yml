name: Release Build (Windows & macOS DMG)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (leave empty for automatic naming)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VSLANG: "1033"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ayugram-windows-v1
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply MSVC Release patch to cmake submodule
        run: python Telegram/build/patch_cmake.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Restore Windows Libraries & ThirdParty
        id: windows-libraries-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/../Libraries
            ${{ github.workspace }}/../ThirdParty
          key: libs-win-${{ hashFiles('Telegram/build/prepare/**', 'Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            libs-win-

      - name: Prepare libraries
        shell: cmd
        run: Telegram\build\prepare\win.bat

      - name: Save Windows Libraries & ThirdParty
        if: steps.windows-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/../Libraries
            ${{ github.workspace }}/../ThirdParty
          key: ${{ steps.windows-libraries-cache.outputs.cache-primary-key }}

      - name: Set up compilation cache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Start compilation cache
        shell: pwsh
        run: |
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --start-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --zero-stats

      - name: Configure Release build
        shell: cmd
        working-directory: Telegram
        run: configure.bat -G "Ninja Multi-Config" -D AYUGRAM_ENABLE_COMPILATION_CACHE=ON -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram
        shell: cmd
        run: cmake --build out --config Release --target Telegram --parallel %NUMBER_OF_PROCESSORS%

      - name: Report compilation cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item out/Release/AyuGram.exe dist/AyuGram.exe
          $filesToZip = @("out/Release/AyuGram.exe")
          if (Test-Path "out/Release/AyuWsProxy.exe") {
            Copy-Item out/Release/AyuWsProxy.exe dist/AyuWsProxy.exe
            $filesToZip += "out/Release/AyuWsProxy.exe"
          }
          Compress-Archive -Path $filesToZip -DestinationPath dist/AyuGram-Windows-x64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-Release
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-14
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ayugram-macos-v1
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Patch macOS Swift files
        run: python3 Telegram/build/patch_mac.py

      - name: Install Homebrew dependencies
        run: |
          brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson create-dmg

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Free macOS build disk space
        run: |
          df -h "$GITHUB_WORKSPACE"
          selected_developer_dir="$(xcode-select -p)"
          selected_xcode="$(cd "$selected_developer_dir/../.." && pwd -P)"
          test -x "$selected_xcode/Contents/Developer/usr/bin/xcodebuild"

          for xcode in /Applications/Xcode*.app; do
            if [[ -d "$xcode" && ! -L "$xcode" && ! "$xcode" -ef "$selected_xcode" ]]; then
              echo "Removing unused Xcode: $xcode"
              sudo rm -rf -- "$xcode"
            fi
          done

          xcodebuild -version
          df -h "$GITHUB_WORKSPACE"

      - name: Restore macOS Libraries & ThirdParty
        id: macos-libraries-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/../Libraries
            ${{ github.workspace }}/../ThirdParty
          key: libs-mac-${{ hashFiles('Telegram/build/prepare/**', 'Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            libs-mac-

      - name: Prepare libraries
        run: |
          ./Telegram/build/prepare/mac.sh
          df -h "$GITHUB_WORKSPACE"

      - name: Save macOS Libraries & ThirdParty
        if: steps.macos-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/../Libraries
            ${{ github.workspace }}/../ThirdParty
          key: ${{ steps.macos-libraries-cache.outputs.cache-primary-key }}

      - name: Set up compilation cache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Start compilation cache
        run: |
          sccache --start-server
          sccache --zero-stats

      - name: Configure Release build
        run: |
          ./Telegram/configure.sh -D AYUGRAM_ENABLE_COMPILATION_CACHE=ON -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build AyuGram
        run: |
          cmake --build out --config Release --target Telegram -- CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Report compilation cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Package macOS DMG
        run: |
          APP_PATH=$(find out -name "AyuGram.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: AyuGram.app not found!"
            find out -maxdepth 4
            exit 1
          fi

          mkdir -p dist
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "AyuGram" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "AyuGram.app" 175 120 \
              --hide-extension "AyuGram.app" \
              --app-drop-link 425 120 \
              "dist/AyuGram-macOS.dmg" \
              "$APP_PATH" || {
                echo "create-dmg exited with warning/code $?, falling back to hdiutil..."
                hdiutil create -volname "AyuGram" -srcfolder "$APP_PATH" -ov -format UDZO "dist/AyuGram-macOS.dmg"
              }
          else
            hdiutil create -volname "AyuGram" -srcfolder "$APP_PATH" -ov -format UDZO "dist/AyuGram-macOS.dmg"
          fi

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS-DMG
          path: dist/AyuGram-macOS.dmg
          if-no-files-found: error

      - name: Report macOS disk usage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          for path in "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/../Libraries" "$GITHUB_WORKSPACE/../ThirdParty"; do
            if [[ -d "$path" ]]; then
              du -sh "$path"
            fi
          done

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: AyuGram-Windows-Release
          path: release_assets/windows

      - name: Download macOS DMG artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: AyuGram-macOS-DMG
          path: release_assets/macos

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="release-${{ github.run_number }}"
          fi

          TITLE="AyuGram Release ($TAG)"
          NOTES="Release build of AyuGram. Commit: ${{ github.sha }}"

          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          ASSETS=()
          if [ -f "release_assets/windows/AyuGram.exe" ]; then
            ASSETS+=("release_assets/windows/AyuGram.exe#AyuGram.exe")
          fi
          if [ -f "release_assets/windows/AyuGram-Windows-x64.zip" ]; then
            ASSETS+=("release_assets/windows/AyuGram-Windows-x64.zip#AyuGram-Windows-x64.zip")
          fi
          if [ -f "release_assets/macos/AyuGram-macOS.dmg" ]; then
            ASSETS+=("release_assets/macos/AyuGram-macOS.dmg#AyuGram-macOS.dmg")
          fi

          echo "Publishing assets to release $TAG: ${ASSETS[*]}"

          if gh release view "$TAG" --repo "${{ github.repository }}" &> /dev/null; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          fi
