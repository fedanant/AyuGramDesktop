name: Release Build (Windows & macOS DMG)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (leave empty for automatic naming)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      macos_only:
        description: 'Build only macOS'
        required: false
        type: boolean
        default: false
      publish_release:
        description: 'Publish build artifacts to a GitHub Release'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (x64)
    if: github.event_name != 'workflow_dispatch' || !inputs.macos_only
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VSLANG: "1033"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ayugram-windows-v1
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply MSVC Release patch to cmake submodule
        run: python Telegram/build/patch_cmake.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Resolve dependency cache paths
        id: dependency-cache-paths
        shell: python
        run: |
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve().parent
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"libraries={root / 'Libraries'}", file=output)
              print(f"third-party={root / 'ThirdParty'}", file=output)

      - name: Restore Windows Libraries & ThirdParty
        id: windows-libraries-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.dependency-cache-paths.outputs.libraries }}
            ${{ steps.dependency-cache-paths.outputs.third-party }}
          key: libs-win-${{ hashFiles('Telegram/build/prepare/**', 'Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            libs-win-

      - name: Prepare libraries
        shell: cmd
        run: Telegram\build\prepare\win.bat

      - name: Save Windows Libraries & ThirdParty
        if: steps.windows-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.dependency-cache-paths.outputs.libraries }}
            ${{ steps.dependency-cache-paths.outputs.third-party }}
          key: ${{ steps.windows-libraries-cache.outputs.cache-primary-key }}

      - name: Set up compilation cache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Start compilation cache
        shell: pwsh
        run: |
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --start-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --zero-stats

      - name: Configure Release build
        shell: cmd
        working-directory: Telegram
        run: configure.bat -G "Ninja Multi-Config" -D AYUGRAM_ENABLE_COMPILATION_CACHE=ON -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram
        shell: cmd
        run: cmake --build out --config Release --target Telegram --parallel %NUMBER_OF_PROCESSORS%

      - name: Report compilation cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item out/Release/AyuGram.exe dist/AyuGram.exe
          $filesToZip = @("out/Release/AyuGram.exe")
          if (Test-Path "out/Release/AyuWsProxy.exe") {
            Copy-Item out/Release/AyuWsProxy.exe dist/AyuWsProxy.exe
            $filesToZip += "out/Release/AyuWsProxy.exe"
          }
          Compress-Archive -Path $filesToZip -DestinationPath dist/AyuGram-Windows-x64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-Release
          path: dist/*
          if-no-files-found: error

  prepare-macos:
    name: Prepare macOS dependencies
    runs-on: macos-14
    timeout-minutes: 360
    outputs:
      toolchain: ${{ steps.setup.outputs.toolchain }}
      build-root: ${{ steps.paths.outputs.build-root }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up macOS build tools
        id: setup
        uses: ./.github/actions/setup-macos-build

      - name: Resolve dependency paths
        id: paths
        run: echo "build-root=$(cd "$GITHUB_WORKSPACE/.." && pwd -P)" >> "$GITHUB_OUTPUT"

      - name: Test universal bundle assembly
        run: python3 -m unittest discover -s .github/scripts -p 'test_merge_macos_apps.py'

      - name: Restore prepared dependency archive
        id: dependencies
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/macos-dependencies.tar.zst
          key: macos-prepared-v2-${{ runner.arch }}-${{ steps.setup.outputs.toolchain }}-${{ hashFiles('Telegram/build/prepare/**', 'Telegram/build/qt_version.py', '.github/actions/setup-macos-build/action.yml', '.github/workflows/release.yml') }}

      - name: Prepare libraries
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: ./Telegram/build/prepare/mac.sh

      - name: Archive prepared dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: |
          # Qt is consumed from Libraries/local/Qt-*, not its source/build
          # tree. Keep installed files, symlinks and executable permissions;
          # omit clone metadata and preparation stamps from this build-only
          # archive. Consumers configure directly and never run prepare.py.
          gtar -C "$GITHUB_WORKSPACE/.." \
            --exclude='.git' \
            --exclude='Libraries/qt_*' \
            --exclude='Libraries/cache_keys' \
            --exclude='ThirdParty/cache_keys' \
            -I 'zstd -T0 -3' \
            -cf "$RUNNER_TEMP/macos-dependencies.tar.zst" Libraries ThirdParty
          ls -lh "$RUNNER_TEMP/macos-dependencies.tar.zst"

      - name: Save prepared dependency archive
        if: steps.dependencies.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/macos-dependencies.tar.zst
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Upload dependencies for this run
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS-dependencies
          path: ${{ runner.temp }}/macos-dependencies.tar.zst
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error

  build-macos-arch:
    name: Build macOS (${{ matrix.arch }})
    needs: prepare-macos
    runs-on: macos-14
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      MAC_ARCH: ${{ matrix.arch }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ayugram-macos-v2
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up macOS build tools
        id: setup
        uses: ./.github/actions/setup-macos-build

      - name: Check dependency toolchain and installation prefix
        env:
          EXPECTED_TOOLCHAIN: ${{ needs.prepare-macos.outputs.toolchain }}
          ACTUAL_TOOLCHAIN: ${{ steps.setup.outputs.toolchain }}
          EXPECTED_BUILD_ROOT: ${{ needs.prepare-macos.outputs.build-root }}
        run: |
          test "$ACTUAL_TOOLCHAIN" = "$EXPECTED_TOOLCHAIN"
          test "$(cd "$GITHUB_WORKSPACE/.." && pwd -P)" = "$EXPECTED_BUILD_ROOT"

      - name: Download prepared dependencies
        uses: actions/download-artifact@v4
        with:
          name: AyuGram-macOS-dependencies
          path: ${{ runner.temp }}

      - name: Extract prepared dependencies
        run: |
          gtar -C "$GITHUB_WORKSPACE/.." -I zstd -xf "$RUNNER_TEMP/macos-dependencies.tar.zst"
          rm -- "$RUNNER_TEMP/macos-dependencies.tar.zst"
          df -h "$GITHUB_WORKSPACE"

      - name: Patch macOS Swift files
        run: python3 Telegram/build/patch_mac.py

      - name: Set up compilation cache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Start compilation cache
        run: |
          sccache --start-server
          sccache --zero-stats

      - name: Configure Release build
        run: |
          ./Telegram/configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_OSX_ARCHITECTURES="$MAC_ARCH" \
            -D DESKTOP_APP_MAC_ARCH="$MAC_ARCH" \
            -D AYUGRAM_ENABLE_COMPILATION_CACHE=ON \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -D CMAKE_C_FLAGS="-Xclang -fno-pch-timestamp" \
            -D CMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp"

      - name: Build AyuGram
        run: |
          cmake --build out --config Release --target Telegram \
            --parallel "$(sysctl -n hw.logicalcpu)" -- \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Report compilation cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Archive app bundle
        run: |
          test -x out/Release/AyuGram.app/Contents/MacOS/AyuGram
          xcrun lipo out/Release/AyuGram.app/Contents/MacOS/AyuGram -verify_arch "$MAC_ARCH"
          mkdir -p dist
          tar -C out/Release -czf "dist/AyuGram-$MAC_ARCH.app.tar.gz" AyuGram.app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS-${{ matrix.arch }}
          path: dist/AyuGram-${{ matrix.arch }}.app.tar.gz
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Report macOS disk usage
        if: always()
        run: df -h "$GITHUB_WORKSPACE"

  build-macos:
    name: Package universal macOS DMG
    needs: build-macos-arch
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Select Xcode and install packaging tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          brew install create-dmg

      - name: Download Intel app bundle
        uses: actions/download-artifact@v4
        with:
          name: AyuGram-macOS-x86_64
          path: bundles

      - name: Download Apple Silicon app bundle
        uses: actions/download-artifact@v4
        with:
          name: AyuGram-macOS-arm64
          path: bundles

      - name: Assemble universal app
        run: |
          for arch in x86_64 arm64; do
            mkdir -p "bundles/$arch"
            tar -xzf "bundles/AyuGram-$arch.app.tar.gz" -C "bundles/$arch"
          done
          mkdir -p dist
          python3 .github/scripts/merge_macos_apps.py \
            bundles/arm64/AyuGram.app bundles/x86_64/AyuGram.app dist/AyuGram.app

      - name: Package macOS DMG
        run: |
          APP_PATH="$GITHUB_WORKSPACE/dist/AyuGram.app"
          create-dmg \
            --volname "AyuGram" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AyuGram.app" 175 120 \
            --hide-extension "AyuGram.app" \
            --app-drop-link 425 120 \
            "dist/AyuGram-macOS.dmg" \
            "$APP_PATH" || {
              rm -f -- dist/AyuGram-macOS.dmg
              hdiutil create -volname "AyuGram" -srcfolder "$APP_PATH" -ov -format UDZO "dist/AyuGram-macOS.dmg"
            }
          hdiutil verify dist/AyuGram-macOS.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS-DMG
          path: dist/AyuGram-macOS.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: >-
      always() && !cancelled()
      && (github.event_name != 'workflow_dispatch' || inputs.publish_release)
      && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: AyuGram-Windows-Release
          path: release_assets/windows

      - name: Download macOS DMG artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: AyuGram-macOS-DMG
          path: release_assets/macos

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="release-${{ github.run_number }}"
          fi

          TITLE="AyuGram Release ($TAG)"
          NOTES="Release build of AyuGram. Commit: ${{ github.sha }}"

          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          ASSETS=()
          if [ -f "release_assets/windows/AyuGram.exe" ]; then
            ASSETS+=("release_assets/windows/AyuGram.exe#AyuGram.exe")
          fi
          if [ -f "release_assets/windows/AyuGram-Windows-x64.zip" ]; then
            ASSETS+=("release_assets/windows/AyuGram-Windows-x64.zip#AyuGram-Windows-x64.zip")
          fi
          if [ -f "release_assets/macos/AyuGram-macOS.dmg" ]; then
            ASSETS+=("release_assets/macos/AyuGram-macOS.dmg#AyuGram-macOS.dmg")
          fi

          echo "Publishing assets to release $TAG: ${ASSETS[*]}"

          if gh release view "$TAG" --repo "${{ github.repository }}" &> /dev/null; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          fi
