name: Windows Debug Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: windows-debug-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare libraries
        shell: cmd
        run: Telegram\build\prepare\win.bat skip-release

      - name: Configure Debug build
        shell: cmd
        working-directory: Telegram
        run: configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram
        shell: cmd
        run: cmake --build out --config Debug --target Telegram -- /m:2

      - name: Upload AyuGram
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-Debug
          path: out/Debug/AyuGram.exe
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "server-deeplink-${{ github.run_number }}"
          $asset = "out/Debug/AyuGram.exe#AyuGram.exe"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "AyuGram server deeplink (${{ github.run_number }})" `
              --notes "Debug-сборка AyuGram с поддержкой tg://server deeplink. Commit: ${{ github.sha }}" `
              --prerelease
          }
